<!DOCTYPE html>
<html lang="uz">

<head>

  <meta charset="UTF-8">

    <meta
        name="viewport"
            content="width=device-width, initial-scale=1.0"
              >

                    Ro‘yxatdan o‘tish — Hizmatlar
                      </title>

                        <link
                            rel="stylesheet"
                                href="styles.css"
                                  >

                                  </head>

                                  <body>

                                  <header class="header">

                                    <a
                                        href="index.html"
                                            class="logo"
                                              >
                                                  Hizmatlar
                                                    </a>

                                                      <nav class="nav">

                                                          <a href="index.html">
                                                                Bosh sahifa
                                                                    </a>

                                                                        <a href="doctor.html">
                                                                              Shifokor
                                                                                  </a>

                                                                                      <a href="lawyer.html">
                                                                                            Advokat
                                                                                                </a>

                                                                                                    <a href="login.html">
                                                                                                          Kirish
                                                                                                              </a>

                                                                                                                </nav>

                                                                                                                </header>

                                                                                                                <main>

                                                                                                                <section class="services-section">

                                                                                                                  <div class="section-header">

                                                                                                                      <div class="section-label">
                                                                                                                            YANGI HISOB
                                                                                                                                </div>

                                                                                                                                    <h1>
                                                                                                                                          📝 Ro‘yxatdan o‘tish
                                                                                                                                              </h1>

                                                                                                                                                  <p>
                                                                                                                                                        Hizmatlar platformasidan foydalanish
                                                                                                                                                              uchun hisob yarating.
                                                                                                                                                                  </p>

                                                                                                                                                                    </div>

                                                                                                                                                                      <form
                                                                                                                                                                          class="form"
                                                                                                                                                                              id="registerForm"
                                                                                                                                                                                >

                                                                                                                                                                                    <label>
                                                                                                                                                                                          Ism-familiya
                                                                                                                                                                                              </label>

                                                                                                                                                                                                  <input
                                                                                                                                                                                                        type="text"
                                                                                                                                                                                                              id="registerName"
                                                                                                                                                                                                                    placeholder="Ism va familiyangiz"
                                                                                                                                                                                                                          required
                                                                                                                                                                                                                              >

                                                                                                                                                                                                                                  <label>
                                                                                                                                                                                                                                        Telefon raqam
                                                                                                                                                                                                                                            </label>

                                                                                                                                                                                                                                                <input
                                                                                                                                                                                                                                                      type="tel"
                                                                                                                                                                                                                                                            id="registerPhone"
                                                                                                                                                                                                                                                                  placeholder="+998 90 123 45 67"
                                                                                                                                                                                                                                                                        required
                                                                                                                                                                                                                                                                            >

                                                                                                                                                                                                                                                                                <label>
                                                                                                                                                                                                                                                                                      Parol
                                                                                                                                                                                                                                                                                          </label>

                                                                                                                                                                                                                                                                                              <input
                                                                                                                                                                                                                                                                                                    type="password"
                                                                                                                                                                                                                                                                                                          id="registerPassword"
                                                                                                                                                                                                                                                                                                                placeholder="Kamida 6 ta belgi"
                                                                                                                                                                                                                                                                                                                      minlength="6"
                                                                                                                                                                                                                                                                                                                            required
                                                                                                                                                                                                                                                                                                                                >

                                                                                                                                                                                                                                                                                                                                    <label>
                                                                                                                                                                                                                                                                                                                                          Parolni tasdiqlang
                                                                                                                                                                                                                                                                                                                                              </label>

                                                                                                                                                                                                                                                                                                                                                  <input
                                                                                                                                                                                                                                                                                                                                                        type="password"
                                                                                                                                                                                                                                                                                                                                                              id="registerPassword2"
                                                                                                                                                                                                                                                                                                                                                                    placeholder="Parolni qayta kiriting"
                                                                                                                                                                                                                                                                                                                                                                          required
                                                                                                                                                                                                                                                                                                                                                                              >
       <button
             type="submit"
                   class="btn"
                       >
                             ✅ Hisob yaratish
                                 </button>

                                     <p>
                                           Hisobingiz bormi?

                                                 <a
                                                         href="login.html"
                                                                 style="color:#2563eb"
                                                                       >
                                                                               Tizimga kiring
                                                                                     </a>
                                                                                         </p>

                                                                                             <div id="registerResult"></div>

                                                                                               </form>

                                                                                               </section>

                                                                                               </main>

                                                                                               <footer class="footer">

                                                                                                 <div class="footer-content">

                                                                                                     <div class="footer-about">

                                                                                                           <div class="footer-logo">
                                                                                                                   Hizmatlar
                                                                                                                         </div>

                                                                                                                               <p>
                                                                                                                                       Barcha xizmatlar bir joyda.
                                                                                                                                             </p>

                                                                                                                                                 </div>

                                                                                                                                                   </div>

                                                                                                                                                     <div class="footer-bottom">
                                                                                                                                                         © 2026 Hizmatlar
                                                                                                                                                           </div>

                                                                                                                                                           </footer>

                                                                                                                                                           <script>

                                                                                                                                                           document
                                                                                                                                                             .getElementById("registerForm")
                                                                                                                                                               .addEventListener("submit", function(e) {

                                                                                                                                                                   e.preventDefault();

                                                                                                                                                                       const name =
                                                                                                                                                                             document.getElementById("registerName").value;

                                                                                                                                                                                 const phone =
                                                                                                                                                                                       document.getElementById("registerPhone").value;

                                                                                                                                                                                           const password =
                                                                                                                                                                                                 document.getElementById("registerPassword").value;

                                                                                                                                                                                                     const password2 =
                                                                                                                                                                                                           document.getElementById("registerPassword2").value;

                                                                                                                                                                                                               if (password !== password2) {

                                                                                                                                                                                                                     document.getElementById("registerResult").innerHTML =
                                                                                                                                                                                                                             `
                                                                                                                                                                                                                                     <div class="notice">
                                                                                                                                                                                                                                               ❌ Parollar bir xil emas.
                                                                                                                                                                                                                                                       </div>
                                                                                                                                                                                                                                                               `;

                                                                                                                                                                                                                                                                     return;
                                                                                                                                                                                                                                                                         }

                                                                                                                                                                                                                                                                             localStorage.setItem(
                                                                                                                                                                                                                                                                                   "hizmatlarName",
                                                                                                                                                                                                                                                                                         name
                                                                                                                                                                                                                                                                                             );

                                                                                                                                                                                                                                                                                                 localStorage.setItem(
                                                                                                                                                                                                                                                                                                       "hizmatlarUser",
                                                                                                                                                                                                                                                                                                             phone
                                                                                                                                                                                                                                                                                                                 );

                                                                                                                                                                                                                                                                                                                     document.getElementById("registerResult").innerHTML =
                                                                                                                                                                                                                                                                                                                           `
                                                                                                                                                                                                                                                                                                                                 <div class="notice">
                                                                                                                                                                                                                                                                                                                                         ✅ Hisob yaratildi!
                                                                                                                                                                                                                                                                                                                                                 <br><br>
                                                                                                                                                                                                                                                                                                                                                         Tizimga kirish sahifasiga o‘tilmoqda...
                                                                                                                                                                                                                                                                                                                                                               </div>
                                                                                                                                                                                                                                                                                                                                                                     `;

                                                                                                                                                                                                                                                                                                                                                                         setTimeout(function() {

                                                                                                                                                                                                                                                                                                                                                                               window.location.href =
                                                                                                                                                                                                                                                                                                                                                                                       "login.html";

                                                                                                                                                                                                                                                                                                                                                                                           }, 1000);

                                                                                                                                                                                                                                                                                                                                                                                             });

                                                                                                                                                                                                                                                                                                                                                                                             </script>

                                                                                                                                                                                                                                                                                                                                                                                             </body>
                                                                                                                                                                                                                                                                                                                                                                                             </html>
